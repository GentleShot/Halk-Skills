<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halk Skills Checklist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1>Halk Skills Checklist</h1>
        <a class="lang-switcher" href="index-es.html">Español</a>
      </div>
      <div class="toolbar">
        <label for="quest-filter">Filter by Quest:</label>
        <select id="quest-filter">
          <option value="all">Show All</option>
        </select>
        <button id="clear-checked" type="button">Clear Checked</button>
      </div>
      <ul id="skill-list">
        <li>Loading skills...</li>
      </ul>
    </div>
    <div class="credits">
        <h3>Credits:</h3>
        <ul>
          <li><a href="https://docs.google.com/spreadsheets/d/17c7OXNxcAZmT0MWRePekAZXQQqdCo7S8ICuXPsgK8Is/edit?gid=515739494#gid=515739494">Halk Skills</a> Fist.moe MHF TW Gdoc</li>
          <li><a href="https://xl3lackout.github.io/MHFZ-Ferias-English-Project/npc/myholk_book.htm">Halk Skills</a> Ferias Database</li>
    </div>

    <script>
      const skillList = document.getElementById("skill-list");
      const questFilter = document.getElementById("quest-filter");
      const clearCheckedButton = document.getElementById("clear-checked");
      const storageKey = "halk-skill-checks";
      let allSkills = [];

      function getSavedChecks() {
        const saved = localStorage.getItem(storageKey);
        return saved ? JSON.parse(saved) : {};
      }

      function saveChecks(checks) {
        localStorage.setItem(storageKey, JSON.stringify(checks));
      }

      function populateQuestFilter(skills) {
        const quests = [...new Set(skills.map((skill) => skill.Quest).filter((quest) => quest && quest !== "All"))].sort();
        const currentValue = questFilter.value;
        questFilter.innerHTML = '<option value="all">Show All</option>';

        quests.forEach((quest) => {
          const option = document.createElement("option");
          option.value = quest;
          option.textContent = quest;
          if (quest === currentValue) {
            option.selected = true;
          }
          questFilter.appendChild(option);
        });
      }

      function renderSkills(skills) {
        const savedChecks = getSavedChecks();
        const selectedQuest = questFilter.value;
        skillList.innerHTML = "";

        const visibleSkills = skills.filter((skill) => {
          if (selectedQuest === "all") {
            return true;
          }
          return skill.Quest === selectedQuest || skill.Quest === "All";
        });

        if (visibleSkills.length === 0) {
          skillList.innerHTML = "<li>No skills match this filter.</li>";
          return;
        }

        visibleSkills.forEach((skill, originalIndex) => {
          const index = skills.indexOf(skill);
          const isChecked = Boolean(savedChecks[index]) || String(skill["Aquired?"]).toUpperCase() === "TRUE";
          const item = document.createElement("li");
          item.className = isChecked ? "checked" : "";

          item.innerHTML = `
            <input type="checkbox" id="skill-${index}" ${isChecked ? "checked" : ""}>
            <label class="item-text" for="skill-${index}">
              <strong>${skill.Book}</strong>
              <div class="meta">Quest: ${skill.Quest} • ${skill["Effect Description"]}</div>
            </label>
          `;

          const checkbox = item.querySelector("input");
          checkbox.addEventListener("change", (event) => {
            const checks = getSavedChecks();
            checks[index] = event.target.checked;
            saveChecks(checks);
            item.classList.toggle("checked", event.target.checked);
          });

          skillList.appendChild(item);
        });
      }

      questFilter.addEventListener("change", () => {
        renderSkills(allSkills);
      });

      clearCheckedButton.addEventListener("click", () => {
        const checks = getSavedChecks();
        Object.keys(checks).forEach((key) => {
          checks[key] = false;
        });
        saveChecks(checks);
        renderSkills(allSkills);
      });

      async function loadSkills() {
        try {
          const response = await fetch("./skills.json");
          if (!response.ok) {
            throw new Error("Failed to load skills.json");
          }

          allSkills = await response.json();
          populateQuestFilter(allSkills);
          renderSkills(allSkills);
        } catch (error) {
          skillList.innerHTML = "<li>Unable to load the checklist. Make sure the page is being served from a local server.</li>";
          console.error(error);
        }
      }

      loadSkills();
    </script>
  </body>
</html>
