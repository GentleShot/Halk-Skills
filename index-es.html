<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de habilidades de Halk</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #222;
        margin: 0;
        padding: 2rem;
      }

      .card {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      #skill-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #skill-list li {
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
        padding: 0.8rem 0;
        border-bottom: 1px solid #eee;
      }

      #skill-list li:last-child {
        border-bottom: none;
      }

      #skill-list li.checked .item-text {
        text-decoration: line-through;
        color: #777;
      }

      input[type="checkbox"] {
        margin-top: 0.3rem;
        width: 1rem;
        height: 1rem;
      }

      .item-text strong {
        display: block;
        margin-bottom: 0.25rem;
      }

      .meta {
        font-size: 0.95rem;
        color: #666;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .toolbar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .lang-switcher {
        display: inline-block;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        background: #2f6fed;
        color: white;
        text-decoration: none;
        font-size: 0.95rem;
      }

      .lang-switcher:hover {
        background: #2558c7;
      }

      select,
      button {
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 0.95rem;
      }

      button {
        cursor: pointer;
        background: #2f6fed;
        color: white;
        border: none;
      }

      button:hover {
        background: #2558c7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1>Lista de habilidades de Halk</h1>
        <a class="lang-switcher" href="index.html">English</a>
      </div>
      <div class="toolbar">
        <label for="quest-filter">Filtrar por misión:</label>
        <select id="quest-filter">
          <option value="all">Mostrar todo</option>
        </select>
        <button id="clear-checked" type="button">Borrar marcados</button>
      </div>
      <ul id="skill-list">
        <li>Cargando habilidades...</li>
      </ul>
    </div>

    <script>
      const skillList = document.getElementById("skill-list");
      const questFilter = document.getElementById("quest-filter");
      const clearCheckedButton = document.getElementById("clear-checked");
      const storageKey = "halk-skill-checks-es";
      let allSkills = [];

      function getSavedChecks() {
        const saved = localStorage.getItem(storageKey);
        return saved ? JSON.parse(saved) : {};
      }

      function saveChecks(checks) {
        localStorage.setItem(storageKey, JSON.stringify(checks));
      }

      function populateQuestFilter(skills) {
        const quests = [...new Set(skills.map((skill) => skill.Quest).filter(Boolean))].sort();
        const currentValue = questFilter.value;
        questFilter.innerHTML = '<option value="all">Mostrar todo</option>';

        quests.forEach((quest) => {
          const option = document.createElement("option");
          option.value = quest;
          option.textContent = quest;
          if (quest === currentValue) {
            option.selected = true;
          }
          questFilter.appendChild(option);
        });
      }

      function renderSkills(skills) {
        const savedChecks = getSavedChecks();
        const selectedQuest = questFilter.value;
        skillList.innerHTML = "";

        const visibleSkills = skills.filter((skill) => {
          if (selectedQuest === "all") {
            return true;
          }
          return skill.Quest === selectedQuest || skill.Quest === "All";
        });

        if (visibleSkills.length === 0) {
          skillList.innerHTML = "<li>No hay habilidades que coincidan con este filtro.</li>";
          return;
        }

        visibleSkills.forEach((skill, originalIndex) => {
          const index = skills.indexOf(skill);
          const isChecked = Boolean(savedChecks[index]) || String(skill["Aquired?"]).toUpperCase() === "TRUE";
          const item = document.createElement("li");
          item.className = isChecked ? "checked" : "";

          item.innerHTML = `
            <input type="checkbox" id="skill-${index}" ${isChecked ? "checked" : ""}>
            <label class="item-text" for="skill-${index}">
              <strong>${skill.Book}</strong>
              <div class="meta">Misión: ${skill.Quest} • ${skill["Effect Description"]}</div>
            </label>
          `;

          const checkbox = item.querySelector("input");
          checkbox.addEventListener("change", (event) => {
            const checks = getSavedChecks();
            checks[index] = event.target.checked;
            saveChecks(checks);
            item.classList.toggle("checked", event.target.checked);
          });

          skillList.appendChild(item);
        });
      }

      questFilter.addEventListener("change", () => {
        renderSkills(allSkills);
      });

      clearCheckedButton.addEventListener("click", () => {
        const checks = getSavedChecks();
        Object.keys(checks).forEach((key) => {
          checks[key] = false;
        });
        saveChecks(checks);
        renderSkills(allSkills);
      });

      async function loadSkills() {
        try {
          const response = await fetch("./skills.json");
          if (!response.ok) {
            throw new Error("No se pudo cargar skills.json");
          }

          allSkills = await response.json();
          populateQuestFilter(allSkills);
          renderSkills(allSkills);
        } catch (error) {
          skillList.innerHTML = "<li>No se pudo cargar la lista. Asegúrate de abrir la página desde un servidor local.</li>";
          console.error(error);
        }
      }

      loadSkills();
    </script>
  </body>
</html>
